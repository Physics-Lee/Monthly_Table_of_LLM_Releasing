name: AA Daily Refresh

# Every day 07:30 Beijing time (23:30 UTC — an off-peak minute, so GitHub's
# cron queue delay stays in the minutes range instead of hours).
# Scheduled workflows only run on the default branch and are disabled after
# 60 days without repository activity.
on:
  schedule:
    - cron: '30 23 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch AA leaderboard
        run: node scripts/fetch-aa.js

      - name: Rebuild vendor ranking
        run: node scripts/aa-vendor-ranking.js

      - name: Commit snapshot if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add scripts/aa-leaderboard.json scripts/aa-first-seen.json aa-ranking.json
          if ! git diff --cached --quiet; then
            COUNT=$(node -p "require('./scripts/aa-leaderboard.json').entries.length")
            git commit -m "data: auto-refresh AA snapshot (${COUNT} entries)"
            git pull --rebase origin HEAD
            git push
          fi

      # fetchedAt only advances when entries actually change, so a multi-day
      # frozen value means CI is being served a stale cache of the page again
      # (seen 2026-10-10..12: runs green, data days old).
      - name: Alert if AA snapshot is stale
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          STALE_AFTER_DAYS=3
          SNAPSHOT=scripts/aa-leaderboard.json
          AGE_DAYS=$(node -p "Math.floor((Date.now() - Date.parse(require('./${SNAPSHOT}').fetchedAt)) / 864e5)")
          echo "AA snapshot last real change: ${AGE_DAYS} days ago"
          if [ "$AGE_DAYS" -ge "$STALE_AFTER_DAYS" ]; then
            if [ -n "$(gh issue list --state open --search "stale-snapshot" --json number --jq '.[].number')" ]; then
              echo "An open stale-snapshot issue already exists; not filing another"
            else
              COUNT=$(node -p "require('./${SNAPSHOT}').entries.length")
              LAST=$(node -p "require('./${SNAPSHOT}').fetchedAt")
              gh issue create \
                --title "[stale-snapshot] AA 快照已 ${AGE_DAYS} 天无数据变化" \
                --body "AA 快照 fetchedAt 停留在 ${LAST}，已 ${AGE_DAYS} 天无任何数据变化（当前 ${COUNT} 条）。AA 榜单几乎每天都有分数变动，连续多天零变化大概率是 CI 又被边缘缓存挡住了。

          排查建议：
          - 本地运行 node scripts/fetch-aa.js 与线上数据比对
          - 检查 fetch-aa.js 的 cache-busting 是否仍有效（Cloudflare 缓存策略可能已调整）"
            fi
          fi

      - name: Reorder vendor columns by AA ranking
        run: node scripts/reorder-vendors.js

      - name: Commit column reorder if changed
        run: |
          git add data.json links.json llm_release_timeline_2022-11_to_2026-04.csv llm_release_timeline_2022-11_to_2026-04.md
          if ! git diff --cached --quiet; then
            git commit -m "data: reorder vendor columns by AA ranking"
            git pull --rebase origin HEAD
            git push
          else
            echo "Column order unchanged"
          fi

      - name: Update monthly table
        id: monthly
        run: |
          set -eo pipefail
          OUT=$(node scripts/update-monthly.js --report /tmp/aa-daily-report.md 2>&1 | tee /dev/stderr)
          ADDED=$(echo "$OUT" | grep -oE 'added=[0-9]+' | head -1 | cut -d= -f2)
          echo "added=${ADDED:-0}" >> "$GITHUB_OUTPUT"

      - name: Consistency check before committing
        run: node scripts/check-data-links.js

      - name: Commit monthly-table changes
        if: success()
        run: |
          git add data.json links.json llm_release_timeline_2022-11_to_2026-04.csv llm_release_timeline_2022-11_to_2026-04.md
          if ! git diff --cached --quiet; then
            git commit -m "data: auto-add ${{ steps.monthly.outputs.added }} new models (AA daily pass)"
            git pull --rebase origin HEAD
            git push
          else
            echo "No monthly-table changes"
          fi

      - name: File audit issue
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f /tmp/aa-daily-report.md ]; then
            gh issue create \
              --title "AA 日报：月表更新（$(date -u +%F)）" \
              --body-file /tmp/aa-daily-report.md
          else
            echo "Nothing to report today"
          fi
